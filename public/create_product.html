<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Crear Producto</title>
    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/style.css">
</head>

<body>
    <div class="container">
        <h2>Crear Nuevo Producto</h2>
        <form id="createProductForm">
            <input type="text" id="name" placeholder="Nombre del producto" required>
            <input type="text" id="code" placeholder="Código" required>
            <input type="number" id="price" placeholder="Precio" step="0.01" required>
            <input type="number" id="stock" placeholder="Cantidad en stock" required>
            <input type="url" id="image_url" placeholder="URL de la imagen (opcional)">
            <textarea id="description" placeholder="Descripción" rows="4"
                style="width: 100%; padding: 10px; margin-bottom: 10px;"></textarea>

            <button type="submit">Crear Producto</button>
            <div id="message" class="error"></div>
        </form>
        <a href="dashboard.html" class="link">Volver al Dashboard</a>
    </div>

    <script src="js/create_product.js"></script>
</body>

</html>
